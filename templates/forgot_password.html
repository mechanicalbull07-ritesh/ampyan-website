{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/public-page-polish.css') }}">

<div class="auth-wrapper public-page-polish forgot-password-polish">

<div class="auth-card">

<h2 class="auth-title">Reset Your AMPYAN Password</h2>

<form method="POST" class="auth-form polish-auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input
type="email"
name="email"
placeholder="Enter your registered email"
required
class="auth-input"
/>

<button type="submit" class="auth-button">
Send Reset Link
</button>

</form>

<a href="/login" class="auth-back">
Back to Login
</a>

</div>

</div>

{% endblock %}
