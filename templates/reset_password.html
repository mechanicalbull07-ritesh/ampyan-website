{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/public-page-polish.css') }}">

<div class="auth-wrapper public-page-polish reset-password-polish"><div class="auth-card">
<h2>Reset Your AMPYAN Password</h2>

<form method="POST" class="polish-auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="password"
           name="password"
           placeholder="Enter new password"
           required>

    <button type="submit" class="auth-btn">
        Reset Password
    </button>
</form>

</div></div>
{% endblock %}
