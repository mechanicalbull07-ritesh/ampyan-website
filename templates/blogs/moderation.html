{% extends "base.html" %}{% block content %}<section class="blog-shell"><h1>Blog moderation</h1>{% for blog in blogs %}<article class="blog-dashboard-row"><div><h2>{{ blog.title }}</h2><p>{{ blog.author.display_name }} · {{ blog.submitted_at }} · Version {{ blog.version }}</p><p>{{ blog.excerpt }}</p></div><form method="POST" action="{{ url_for('website_blogs.moderate', blog_id=blog.id) }}" data-busy-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="version" value="{{ blog.version }}"><label>Action<select name="action"><option value="approve">Approve</option><option value="reject">Reject</option><option value="archive">Archive</option><option value="restore">Restore</option></select></label><label>Reason<input name="reason" maxlength="1000"></label><button type="submit">Apply</button></form></article>{% else %}<div class="empty-state">No Blogs are waiting.</div>{% endfor %}</section>{% endblock %}
